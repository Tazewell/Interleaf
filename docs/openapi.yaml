{
  "openapi": "3.1.0",
  "info": { "title": "Reader Local API", "version": "0.1.0" },
  "security": [{ "session": [] }],
  "paths":
    {
      "/api/research/topics/{topic}/sessions/{session}/runs":
        {
          "post":
            {
              "parameters":
                [
                  {
                    "name": "topic",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                  {
                    "name": "session",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                ],
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            { "$ref": "#/components/schemas/ResearchRunInput" },
                        },
                    },
                },
              "responses":
                {
                  "201":
                    {
                      "description": "Durable run and user question; no external request",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/ResearchRun" },
                            },
                        },
                    },
                  "409": { "description": "Idempotency input conflict" },
                },
            },
        },
      "/api/research/runs/{run}":
        {
          "get":
            {
              "parameters":
                [
                  {
                    "name": "run",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                ],
              "responses":
                {
                  "200":
                    {
                      "description": "Current durable snapshot",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/ResearchRun" },
                            },
                        },
                    },
                },
            },
        },
      "/api/research/runs/{run}/results":
        {
          "get":
            {
              "parameters":
                [
                  {
                    "name": "run",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                ],
              "responses":
                {
                  "200":
                    {
                      "description": "Durable typed results, including incomplete ideas and query coverage; read only",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "$ref": "#/components/schemas/ResearchResults",
                                },
                            },
                        },
                    },
                },
            },
        },
      "/api/research/runs/{run}/{action}":
        {
          "post":
            {
              "parameters":
                [
                  {
                    "name": "run",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                  {
                    "name": "action",
                    "in": "path",
                    "required": true,
                    "schema":
                      {
                        "type": "string",
                        "enum": ["start", "pause", "resume", "cancel"],
                      },
                  },
                ],
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            { "$ref": "#/components/schemas/ResearchControl" },
                        },
                    },
                },
              "responses":
                {
                  "200":
                    {
                      "description": "Terminal or idempotent accepted result",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/ResearchRun" },
                            },
                        },
                    },
                  "202":
                    {
                      "description": "Explicit background attempt accepted",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/ResearchRun" },
                            },
                        },
                    },
                  "409":
                    {
                      "description": "Changed control input, source, model or active topic conflict",
                    },
                },
            },
        },
      "/api/research/runs/{run}/events":
        {
          "get":
            {
              "parameters":
                [
                  {
                    "name": "run",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                  {
                    "name": "after",
                    "in": "query",
                    "schema": { "type": "integer", "minimum": 0 },
                  },
                ],
              "responses":
                {
                  "200":
                    {
                      "description": "Read-only SSE replay; reset instructs client to read durable run/report. Disconnect never cancels run.",
                      "content":
                        {
                          "text/event-stream":
                            { "schema": { "type": "string" } },
                        },
                    },
                },
            },
        },
      "/api/research/sessions/{session}/messages":
        {
          "get":
            {
              "parameters":
                [
                  {
                    "name": "session",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                ],
              "responses":
                {
                  "200":
                    {
                      "description": "Full saved visible history including unanswered questions",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "type": "array",
                                  "items":
                                    {
                                      "$ref": "#/components/schemas/ResearchMessage",
                                    },
                                },
                            },
                        },
                    },
                },
            },
        },
      "/api/research/topics/{topic}/reports":
        {
          "get":
            {
              "parameters":
                [
                  {
                    "name": "topic",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                ],
              "responses":
                {
                  "200":
                    {
                      "description": "Immutable report revisions",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "type": "array",
                                  "items":
                                    {
                                      "$ref": "#/components/schemas/ResearchReport",
                                    },
                                },
                            },
                        },
                    },
                },
            },
        },
      "/api/research/reports/{report}":
        {
          "get":
            {
              "parameters":
                [
                  {
                    "name": "report",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                ],
              "responses":
                {
                  "200":
                    {
                      "description": "Saved report",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "$ref": "#/components/schemas/ResearchReport",
                                },
                            },
                        },
                    },
                },
            },
        },
      "/api/research/reports/{report}/markdown":
        {
          "get":
            {
              "parameters":
                [
                  {
                    "name": "report",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                ],
              "responses":
                {
                  "200":
                    {
                      "description": "Inert Markdown export; never fetches external resources",
                      "content":
                        { "text/markdown": { "schema": { "type": "string" } } },
                    },
                },
            },
        },
      "/api/research/reports/{report}/revisions":
        {
          "post":
            {
              "parameters":
                [
                  {
                    "name": "report",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                ],
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "type": "object",
                              "properties":
                                {
                                  "requestId":
                                    {
                                      "type": "string",
                                      "pattern": "^[0-9a-f]{32}$",
                                    },
                                  "content":
                                    { "type": "string", "maxLength": 4194304 },
                                },
                              "required": ["requestId", "content"],
                            },
                        },
                    },
                },
              "responses":
                {
                  "201":
                    {
                      "description": "Idempotent user-authored revision; inherited source IDs only",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "$ref": "#/components/schemas/ResearchReport",
                                },
                            },
                        },
                    },
                  "409": { "description": "Revision idempotency conflict" },
                },
            },
        },
      "/api/research/sources/{source}":
        {
          "get":
            {
              "description": "Validate original bytes, parser revision, native location and research ownership before returning source content. Historical valid sources remain readable after a run stops.",
              "parameters":
                [
                  {
                    "name": "source",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                ],
              "responses":
                {
                  "200":
                    {
                      "description": "Validated source",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "$ref": "#/components/schemas/ResearchEvidence",
                                },
                            },
                        },
                    },
                  "409":
                    {
                      "description": "Source is stale, removed, forged or unavailable; no content or guessed navigation is returned",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                  "default":
                    {
                      "description": "Error",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                },
            },
        },
      "/api/documents/{id}/bilingual-pdf":
        {
          "post":
            {
              "summary": "Freeze PDF, layout, reading translations and API settings; max 2 jobs, 30 minute TTL",
              "parameters":
                [
                  {
                    "name": "id",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                ],
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "$ref": "#/components/schemas/BilingualPDFCreate",
                            },
                        },
                    },
                },
              "responses":
                {
                  "202":
                    {
                      "description": "Export state; poll until awaiting-confirmation, ready or failed",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "$ref": "#/components/schemas/BilingualPDFJob",
                                },
                            },
                        },
                    },
                  "400":
                    {
                      "description": "Invalid input or missing API configuration",
                    },
                  "403":
                    { "description": "Local session authentication required" },
                  "404": { "description": "Document/job not found or expired" },
                  "409":
                    {
                      "description": "Busy, not ready, stale source or attachment conflict",
                    },
                  "500": { "description": "Export could not be prepared" },
                },
            },
        },
      "/api/documents/{id}/bilingual-pdf/{job}":
        {
          "get":
            {
              "summary": "Read in-memory export state; validates live source identity",
              "parameters":
                [
                  {
                    "name": "id",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                  {
                    "name": "job",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                ],
              "responses":
                {
                  "200":
                    {
                      "description": "Export state; poll until awaiting-confirmation, ready or failed",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "$ref": "#/components/schemas/BilingualPDFJob",
                                },
                            },
                        },
                    },
                  "400":
                    {
                      "description": "Invalid input or missing API configuration",
                    },
                  "403":
                    { "description": "Local session authentication required" },
                  "404": { "description": "Document/job not found or expired" },
                  "409":
                    {
                      "description": "Busy, not ready, stale source or attachment conflict",
                    },
                  "500": { "description": "Export could not be prepared" },
                },
            },
          "delete":
            {
              "summary": "Cancel and join export work, delete owned output; idempotent",
              "parameters":
                [
                  {
                    "name": "id",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                  {
                    "name": "job",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                ],
              "responses":
                {
                  "204": { "description": "Cancelled or already unavailable" },
                  "400":
                    {
                      "description": "Invalid input or missing API configuration",
                    },
                  "403":
                    { "description": "Local session authentication required" },
                  "404": { "description": "Document/job not found or expired" },
                  "409":
                    {
                      "description": "Busy, not ready, stale source or attachment conflict",
                    },
                  "500": { "description": "Export could not be prepared" },
                },
            },
        },
      "/api/documents/{id}/bilingual-pdf/{job}/start":
        {
          "post":
            {
              "summary": "Confirm translation and explicit original-only pages",
              "parameters":
                [
                  {
                    "name": "id",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                  {
                    "name": "job",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                ],
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "$ref": "#/components/schemas/BilingualPDFStart",
                            },
                        },
                    },
                },
              "responses":
                {
                  "202":
                    {
                      "description": "Export state; poll until awaiting-confirmation, ready or failed",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "$ref": "#/components/schemas/BilingualPDFJob",
                                },
                            },
                        },
                    },
                  "400":
                    {
                      "description": "Invalid input or missing API configuration",
                    },
                  "403":
                    { "description": "Local session authentication required" },
                  "404": { "description": "Document/job not found or expired" },
                  "409":
                    {
                      "description": "Busy, not ready, stale source or attachment conflict",
                    },
                  "500": { "description": "Export could not be prepared" },
                },
            },
        },
      "/api/documents/{id}/bilingual-pdf/{job}/file":
        {
          "get":
            {
              "summary": "Download successfully generated PDF; rejects changed or deleted source",
              "parameters":
                [
                  {
                    "name": "id",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                  {
                    "name": "job",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                ],
              "responses":
                {
                  "200":
                    {
                      "description": "Independent bilingual PDF",
                      "content":
                        {
                          "application/pdf":
                            {
                              "schema":
                                { "type": "string", "format": "binary" },
                            },
                        },
                    },
                  "400":
                    {
                      "description": "Invalid input or missing API configuration",
                    },
                  "403":
                    { "description": "Local session authentication required" },
                  "404": { "description": "Document/job not found or expired" },
                  "409":
                    {
                      "description": "Busy, not ready, stale source or attachment conflict",
                    },
                  "500": { "description": "Export could not be prepared" },
                },
            },
        },
      "/api/documents/{id}/bilingual-pdf/{job}/attachment":
        {
          "post":
            {
              "summary": "Attach generated PDF to the current original paper as translation; atomic content deduplication; ready file survives attachment failure",
              "parameters":
                [
                  {
                    "name": "id",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                  {
                    "name": "job",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                ],
              "responses":
                {
                  "200":
                    {
                      "description": "Real content-addressed attachment Document",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Document" },
                            },
                        },
                    },
                  "400":
                    {
                      "description": "Invalid input or missing API configuration",
                    },
                  "403":
                    { "description": "Local session authentication required" },
                  "404": { "description": "Document/job not found or expired" },
                  "409":
                    {
                      "description": "Busy, not ready, stale source or attachment conflict",
                    },
                  "500": { "description": "Export could not be prepared" },
                },
            },
        },
      "/api/papers":
        {
          "get":
            {
              "summary": "List independent paper items including metadata-only records",
              "responses":
                {
                  "200":
                    {
                      "description": "Success",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "type": "array",
                                  "items":
                                    {
                                      "$ref": "#/components/schemas/PaperItem",
                                    },
                                },
                            },
                        },
                    },
                  "400": { "description": "Invalid input" },
                  "401":
                    { "description": "Local session authentication required" },
                  "404": { "description": "Not found" },
                  "409":
                    {
                      "description": "Conflict; resolve explicitly before retrying",
                    },
                },
              "parameters":
                [
                  {
                    "name": "trash",
                    "in": "query",
                    "schema": { "type": "boolean" },
                  },
                ],
            },
          "post":
            {
              "summary": "Create a metadata-only paper item",
              "responses":
                {
                  "201":
                    {
                      "description": "Success",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/PaperItem" },
                            },
                        },
                    },
                  "400": { "description": "Invalid input" },
                  "401":
                    { "description": "Local session authentication required" },
                  "404": { "description": "Not found" },
                  "409":
                    {
                      "description": "Conflict; resolve explicitly before retrying",
                    },
                },
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            { "$ref": "#/components/schemas/PaperPatch" },
                        },
                    },
                },
            },
        },
      "/api/papers/{id}":
        {
          "parameters":
            [
              {
                "name": "id",
                "in": "path",
                "required": true,
                "schema": { "type": "string" },
              },
            ],
          "get":
            {
              "summary": "Read item; old merged IDs resolve to retained item",
              "responses":
                {
                  "200":
                    {
                      "description": "Success",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/PaperItem" },
                            },
                        },
                    },
                  "400": { "description": "Invalid input" },
                  "401":
                    { "description": "Local session authentication required" },
                  "404": { "description": "Not found" },
                  "409":
                    {
                      "description": "Conflict; resolve explicitly before retrying",
                    },
                },
            },
          "patch":
            {
              "summary": "Update item metadata and persistent citation key",
              "responses":
                {
                  "200":
                    {
                      "description": "Success",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/PaperItem" },
                            },
                        },
                    },
                  "400": { "description": "Invalid input" },
                  "401":
                    { "description": "Local session authentication required" },
                  "404": { "description": "Not found" },
                  "409":
                    {
                      "description": "Conflict; resolve explicitly before retrying",
                    },
                },
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            { "$ref": "#/components/schemas/PaperPatch" },
                        },
                    },
                },
            },
          "delete":
            {
              "summary": "Permanently remove item and files through file cleanup; attached active items must be trashed first",
              "responses":
                {
                  "204": { "description": "Success" },
                  "400": { "description": "Invalid input" },
                  "401":
                    { "description": "Local session authentication required" },
                  "404": { "description": "Not found" },
                  "409":
                    {
                      "description": "Conflict; resolve explicitly before retrying",
                    },
                },
            },
        },
      "/api/papers/{id}/attachments/{documentId}":
        {
          "parameters":
            [
              {
                "name": "id",
                "in": "path",
                "required": true,
                "schema": { "type": "string" },
              },
              {
                "name": "documentId",
                "in": "path",
                "required": true,
                "schema": { "type": "string" },
              },
            ],
          "put":
            {
              "summary": "Attach or update role/default of an existing readable file",
              "responses":
                {
                  "200":
                    {
                      "description": "Success",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/PaperItem" },
                            },
                        },
                    },
                  "400": { "description": "Invalid input" },
                  "401":
                    { "description": "Local session authentication required" },
                  "404": { "description": "Not found" },
                  "409":
                    {
                      "description": "Conflict; resolve explicitly before retrying",
                    },
                },
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "type": "object",
                              "properties":
                                {
                                  "role":
                                    {
                                      "type": "string",
                                      "enum":
                                        [
                                          "original",
                                          "translation",
                                          "supplement",
                                          "other",
                                        ],
                                    },
                                  "primary": { "type": "boolean" },
                                },
                              "required": ["role"],
                            },
                        },
                    },
                },
            },
          "delete":
            {
              "summary": "Detach file to books, preserving file and all reading data",
              "responses":
                {
                  "200":
                    {
                      "description": "Success",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/PaperItem" },
                            },
                        },
                    },
                  "400": { "description": "Invalid input" },
                  "401":
                    { "description": "Local session authentication required" },
                  "404": { "description": "Not found" },
                  "409":
                    {
                      "description": "Conflict; resolve explicitly before retrying",
                    },
                },
            },
        },
      "/api/papers/{id}/merge":
        {
          "parameters":
            [
              {
                "name": "id",
                "in": "path",
                "required": true,
                "schema": { "type": "string" },
              },
            ],
          "post":
            {
              "summary": "Atomically merge items, explicit field choices and key selection; preserve every file and reading record",
              "responses":
                {
                  "200":
                    {
                      "description": "Success",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/PaperItem" },
                            },
                        },
                    },
                  "400": { "description": "Invalid input" },
                  "401":
                    { "description": "Local session authentication required" },
                  "404": { "description": "Not found" },
                  "409":
                    {
                      "description": "Conflict; resolve explicitly before retrying",
                    },
                },
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            { "$ref": "#/components/schemas/PaperMerge" },
                        },
                    },
                },
            },
        },
      "/api/papers/citation-keys":
        {
          "post":
            {
              "summary": "Allocate persistent globally unique keys transactionally",
              "responses":
                {
