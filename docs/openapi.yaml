                              "properties":
                                {
                                  "fromPage":
                                    { "type": "integer", "minimum": 1 },
                                  "toPage": { "type": "integer", "minimum": 1 },
                                },
                            },
                        },
                    },
                },
              "responses":
                {
                  "202":
                    {
                      "description": "Range queued",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "type": "object",
                                  "required":
                                    [
                                      "queued",
                                      "characters",
                                      "nextPage",
                                      "parsing",
                                    ],
                                  "properties":
                                    {
                                      "queued": { "type": "integer" },
                                      "characters": { "type": "integer" },
                                      "nextPage":
