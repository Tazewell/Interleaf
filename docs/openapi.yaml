      "/api/documents/{id}/chat":
        {
          "post":
            {
              "responses":
                {
                  "200":
                    {
                      "description": "SSE v1: status, delta, fallback, error, done. See ChatStreamEvent. done is sent once only after confirmed upstream completion and successful assistant persistence. Fallback is allowed only before the first text delta. Disconnect cancels upstream; missing done requires checking messages, never automatic POST replay.",
                      "content":
                        {
                          "text/event-stream":
                            {
                              "schema":
                                {
                                  "type": "string",
                                  "description": "SSE frames separated by blank lines. See ChatStreamEvent for each event data shape.",
                                },
                              "x-event-schema":
                                {
                                  "$ref": "#/components/schemas/ChatStreamEvent",
                                },
                              "examples":
                                {
                                  "success":
                                    {
                                      "value": "event: status\ndata: {\"status\":\"reading\"}\n\nevent: delta\ndata: {\"text\":\"回答\"}\n\nevent: done\ndata: {\"ok\":true}\n\n",
                                    },
                                },
                            },
                        },
                    },
                  "default":
                    {
                      "description": "Error",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                },
              "parameters":
                [
                  {
                    "in": "path",
                    "name": "id",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                ],
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "type": "object",
                              "properties":
                                {
                                  "provider":
                                    {
                                      "enum":
                                        ["codex", "claude", "kimi", "api"],
                                    },
                                  "attachments":
                                    {
                                      "type": "array",
                                      "maxItems": 4,
                                      "items":
                                        {
                                          "type": "string",
                                          "pattern": "^p[1-9][0-9]*-b[1-9][0-9]*$",
                                        },
                                    },
                                  "userMessageId":
                                    {
                                      "type": "string",
                                      "pattern": "^[a-f0-9]{32}$",
                                      "description": "Stable client-generated user message ID. Reuse only for explicit regeneration of the same unanswered last question, with unchanged prompt, context, references, attachments and reading location. The server uses current model settings, does not insert a duplicate question, and returns 409 if the turn has an answer or later messages. Omit for legacy clients.",
                                    },
                                  "prompt": { "type": "string" },
                                  "context": { "type": "string" },
                                  "readingLocation":
                                    {
                                      "$ref": "#/components/schemas/DocumentLocation",
                                      "description": "Reading position captured when sending the question. Navigation context only; does not attach page text or establish evidence.",
                                    },
                                  "references":
                                    {
                                      "type": "array",
                                      "items":
                                        {
                                          "type": "object",
                                          "properties":
                                            {
                                              "text": { "type": "string" },
                                              "kind":
                                                {
                                                  "enum":
                                                    ["selection", "section"],
                                                },
                                              "location":
                                                {
                                                  "$ref": "#/components/schemas/DocumentLocation",
                                                },
                                              "sourceId": { "type": "string" },
                                              "pageImage":
                                                {
                                                  "$ref": "#/components/schemas/PageImageEvidence",
                                                },
                                              "corpusRevision":
                                                { "type": "string" },
                                              "contentHash":
                                                { "type": "string" },
                                              "precision":
                                                {
                                                  "type": "string",
                                                  "enum":
                                                    [
                                                      "page",
                                                      "block",
                                                      "paragraph",
                                                    ],
                                                },
                                            },
                                          "required": ["text", "location"],
                                        },
                                    },
                                },
                              "required": ["provider", "prompt", "context"],
                            },
                        },
                    },
                },
            },
        },
